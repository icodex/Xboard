resource_parser_url=https://gh-proxy.com/https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

#IP_API 改自 @XIAO_KOP
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://gh-proxy.com/https://raw.githubusercontent.com/limbopro/QuantumultX/master/Scripts/IP_API.js

server_check_url=http://cp.cloudflare.com/generate_204
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com

fallback_udp_policy=direct

[dns]
;no-ipv6
no-system
server=223.5.5.5
server=114.114.114.114
server=119.29.29.29
server=[2400:3200:baba::1]
server=[2400:3200::1]

[policy]
static = $app_name, "自动选择", "故障转移", $proxy_group, img-url=https://gh-proxy.com/https://raw.githubusercontent.com/icodex/icons/main/apps/Match.png
url-latency-benchmark = 自动选择, $proxy_group, check-interval=600, alive-checking=false, tolerance=0
available = 故障转移, $proxy_group

